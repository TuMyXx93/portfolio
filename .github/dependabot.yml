version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - Tumi-dev
    assignees:
      - Tumi-dev
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - automated
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    reviewers:
      - Tumi-dev
    assignees:
      - Tumi-dev
    commit-message:
      prefix: ci
      include: scope
    labels:
      - github-actions
      - automated
