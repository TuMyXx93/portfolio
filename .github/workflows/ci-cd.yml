name: CI Web Validation

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E smoke
        run: npm run test:e2e

      - name: Setup Engram Cloud
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        run: |
          engram cloud enroll portfolio || true
        env:
          ENGRAM_CLOUD_TOKEN: ${{ secrets.ENGRAM_CLOUD_TOKEN }}
          ENGRAM_CLOUD_SERVER: ${{ secrets.ENGRAM_CLOUD_SERVER }}

      - name: Sync Engram Memories
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        run: |
          engram sync --cloud --project portfolio || true
        env:
          ENGRAM_CLOUD_TOKEN: ${{ secrets.ENGRAM_CLOUD_TOKEN }}
          ENGRAM_CLOUD_SERVER: ${{ secrets.ENGRAM_CLOUD_SERVER }}
