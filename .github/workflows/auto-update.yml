name: 🔄 Auto Update Dependencies

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM
  workflow_dispatch:

jobs:
  update-dependencies:
    name: 🔄 Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: 🔍 Check for outdated packages
        run: pnpm outdated || true

      - name: 🆙 Update patch and minor versions
        run: pnpm update

      - name: 🧪 Validate after updates
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run type-check
          pnpm run test
          pnpm run build

      - name: 📝 Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: '🔄 Automated dependency updates'
          body: |
            ## 🔄 Automated Dependency Updates

            This PR contains automated updates to dependencies:

            - ✅ Patch and minor version updates
            - ✅ Unit tests passed
            - ✅ Build validation passed
            - ✅ Lint checks passed
            - ℹ️ E2E smoke validation runs in standard PR CI (`/verify-web` policy)

            **Review and merge if all checks pass.**

            Generated by GitHub Actions 🤖
          branch: chore/dependency-updates
          delete-branch: true
